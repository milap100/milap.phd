<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="milap.phd — home">
      <img src="{{ '/assets/images/logo-persistence.svg' | relative_url }}" alt="" width="40" height="40">
      <span>milap.phd</span><small>Mathematics PhD researcher</small>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% assign nav = "Research|/research/,Articles|/articles/,Publications|/publications/,Teaching|/teaching/,About|/about/,CV|/cv/,Contact|/contact/" | split: "," %}
      {% for item in nav %}{% assign p = item | split: "|" %}<a href="{{ p[1] | relative_url }}"{% if page.url == p[1] %} aria-current="page"{% endif %}>{{ p[0] }}</a>{% endfor %}
    </nav>
  </div>
</header>
