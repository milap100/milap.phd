<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Milap Rajgor — home"><span>Milap Rajgor</span><small>{{ site.data.profile.domain }}</small></a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% assign nav = "Research|/research/,Publications|/publications/,Teaching|/teaching/,CV|/cv/,About|/about/,Contact|/contact/" | split: "," %}
      {% for item in nav %}{% assign p = item | split: "|" %}<a href="{{ p[1] | relative_url }}"{% if page.url == p[1] %} aria-current="page"{% endif %}>{{ p[0] }}</a>{% endfor %}
    </nav>
  </div>
</header>
