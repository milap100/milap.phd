<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#030914">
  {% assign page_title = page.title | default: site.title %}
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}"><link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website"><meta property="og:title" content="{{ page_title | escape }}"><meta property="og:description" content="{{ page.description | default: site.description | escape }}"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ '/assets/images/molecular-hero.png' | absolute_url }}"><meta property="og:image:alt" content="Translucent biomolecular form on a deep blue background">
  <meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ page_title | escape }}"><meta name="twitter:description" content="{{ page.description | default: site.description | escape }}"><meta name="twitter:image" content="{{ '/assets/images/molecular-hero.png' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}"><a class="skip" href="#content">Skip to content</a>{% include header.html %}<main id="content">{{ content }}</main>{% include footer.html %}</body>
</html>
